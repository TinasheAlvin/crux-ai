name: Build, test, and deploy Azure demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      slot:
        description: App Service slot name. Leave empty to deploy production.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore, build, and test
        run: |
          dotnet build src/CruxAI.sln --configuration Release
          dotnet test src/CruxAI.sln --configuration Release --no-build

      - name: Publish web
        run: dotnet publish src/CruxAI.Web/CruxAI.Web.csproj --configuration Release --output publish

      - name: Sample CSVs ship with the site
        run: |
          test -f publish/testdata/sample-transactions.csv
          test -f publish/testdata/sample-transactions-clean.csv
          test -f publish/testdata/sample-transactions-with-cash.csv
          test -f publish/CruxAI.Web.dll

      - name: Build Bicep
        run: |
          curl -fsSL -o bicep https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64
          chmod +x bicep
          ./bicep build infra/main.bicep --outfile "$RUNNER_TEMP/main.json"

      - name: Upload publish artifact
        if: vars.AZURE_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: crux-web
          path: publish
          retention-days: 5

  deploy:
    needs: build
    if: vars.AZURE_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: crux-web
          path: publish

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          slot-name: ${{ inputs.slot || secrets.AZURE_WEBAPP_SLOT }}
          package: publish
